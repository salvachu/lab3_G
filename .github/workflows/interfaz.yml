name: Interfaz Linux CPU
on: [push, workflow_dispatch]
jobs:
  linux:
    runs-on: ubuntu-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: |
          python -m pip install torch==2.7.1 --index-url https://download.pytorch.org/whl/cpu
          python -m pip install numpy pillow
      - name: Probar las dos variantes desde el servidor local
        run: |
          python interfaz.py --cpu &
          server=$!
          trap 'kill "$server"' EXIT
          curl --retry 20 --retry-delay 1 --retry-connrefused -fsS http://127.0.0.1:7860/api/tipos > /dev/null
          python - <<'PY'
          import base64, json
          from io import BytesIO
          from urllib.request import urlopen, Request
          from PIL import Image
          for model in ("ficha", "cuerpos"):
              data=json.dumps({"model":model,"types":["bug","poison"],"seed":96553}).encode()
              result=json.load(urlopen(Request("http://127.0.0.1:7860/api/generar",data=data)))
              for side in ("front","back"):
                  image=Image.open(BytesIO(base64.b64decode(result[side].split(",")[1])))
                  assert image.size==(96,96) and image.format=="PNG"
              assert result["model"]==model and result["front"]!=result["back"]
          PY
